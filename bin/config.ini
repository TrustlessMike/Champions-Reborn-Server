; IP the server sockets bind to. Use 0.0.0.0 to listen on all interfaces.
service_ip=0.0.0.0
; IP sent to clients so they know where to connect.
; Set this to your external/LAN IP when service_ip is 0.0.0.0.
; If omitted, falls back to service_ip.
public_ip=
con_lobby_port=40900
rta_lobby_port=40910
discovery_port=10101
; Seconds a connection may stay silent before the server drops it. A console that has
; nothing to say sends an empty frame every 11 seconds or so, but only while the game is
; running normally; a long loading screen stops that clock. Default 120.
client_timeout=120
; Leave at 0 unless a console on the same network as this server plays with consoles on the
; Internet. The server sees such a console at its private address (192.168.x.x, 10.x.x.x,
; 172.16-31.x.x or 127.x.x.x) and would tell the others to connect there. With 1, players
; whose own address is not private are told public_ip instead, with the port unchanged.
; Requirements and limits:
;  - public_ip must be the router's public IPv4 address as four numbers (a host name will
;    not do here), and the console on this network must itself be able to reach the server
;    at that address, because public_ip is also what it is told to connect to.
;  - the server cannot see which public port the router gives the console's game socket.
;    It works when the router keeps the port number, or when UDP 4000-4004 is forwarded
;    to the console; with two consoles on this network only one can have each port.
;  - players who are on this network themselves are still told the private address.
;  - a third player learns the others' addresses from the game's host, not from this
;    server. If the host and another player are both on this network, the host knows
;    that player by its private address and passes that on.
report_public_ip_for_lan_consoles=0
